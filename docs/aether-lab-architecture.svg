<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-label="Aether Lab full architecture">
  <rect width="1400" height="920" fill="#070b12"/>
  <text x="40" y="42" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Aether Lab — sheshanhebron.com</text>
  <text x="40" y="66" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Visitor traffic (top) is separate from Terraform / GitHub (bottom). Cloudflare is DNS only.</text>

  <rect x="40" y="110" width="140" height="72" rx="12" fill="#121b2c" stroke="#3ee0b4" stroke-width="1.5"/>
  <text x="110" y="142" text-anchor="middle" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Visitor</text>
  <text x="110" y="160" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Browser</text>

  <rect x="40" y="200" width="140" height="56" rx="10" fill="#0e1522" stroke="#2a3548"/>
  <text x="110" y="222" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">Cloudflare DNS</text>
  <text x="110" y="238" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">not on HTTPS path</text>

  <line x1="180" y1="130" x2="248" y2="130" stroke="#3ee0b4" stroke-width="2"/>
  <polygon points="248,126 260,130 248,134" fill="#3ee0b4"/>
  <rect x="260" y="96" width="200" height="100" rx="12" fill="#121b2c" stroke="#3ee0b4" stroke-width="1.5"/>
  <text x="360" y="128" text-anchor="middle" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Amazon CloudFront</text>
  <text x="360" y="146" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">HTTPS → ACM us-east-1</text>
  <text x="360" y="162" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">sheshanhebron.com</text>
  <text x="360" y="178" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">+ www</text>

  <line x1="460" y1="146" x2="528" y2="146" stroke="#3ee0b4" stroke-width="2"/>
  <polygon points="528,142 540,146 528,150" fill="#3ee0b4"/>
  <rect x="540" y="110" width="190" height="72" rx="12" fill="#121b2c" stroke="#e7157b" stroke-width="1.5"/>
  <text x="635" y="142" text-anchor="middle" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">S3 website</text>
  <text x="635" y="160" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">private origin → OAC</text>

  <line x1="110" y1="182" x2="110" y2="300" stroke="#3ee0b4" stroke-width="2"/>
  <line x1="110" y1="300" x2="248" y2="300" stroke="#3ee0b4" stroke-width="2"/>
  <polygon points="248,296 260,300 248,304" fill="#3ee0b4"/>
  <text x="150" y="290" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">labs API (not via CloudFront)</text>

  <rect x="260" y="264" width="200" height="72" rx="12" fill="#121b2c" stroke="#a166ff" stroke-width="1.5"/>
  <text x="360" y="296" text-anchor="middle" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">API Gateway</text>
  <text x="360" y="314" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">HTTP API → ap-south-1</text>

  <line x1="460" y1="300" x2="528" y2="300" stroke="#3ee0b4" stroke-width="2"/>
  <polygon points="528,296 540,300 528,304" fill="#3ee0b4"/>
  <rect x="540" y="264" width="190" height="72" rx="12" fill="#121b2c" stroke="#ff9900" stroke-width="1.5"/>
  <text x="635" y="296" text-anchor="middle" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">AWS Lambda</text>
  <text x="635" y="314" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">HTTP handler → arm64</text>

  <text x="40" y="390" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Cloud Playground labs</text>

  <rect x="40" y="410" width="250" height="150" rx="12" fill="#0e1522" stroke="#2a3548"/>
  <text x="165" y="434" text-anchor="middle" fill="#3ee0b4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">1. Visitor Counter</text>
  <text x="54" y="458" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">POST /visits</text>
  <text x="54" y="478" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Lambda → DynamoDB</text>
  <text x="54" y="498" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">atomic counter</text>

  <rect x="310" y="410" width="250" height="150" rx="12" fill="#0e1522" stroke="#2a3548"/>
  <text x="435" y="434" text-anchor="middle" fill="#3ee0b4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">2. Message Relay</text>
  <text x="324" y="458" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">POST /jobs → SQS</text>
  <text x="324" y="478" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Worker Lambda → DynamoDB</text>
  <text x="324" y="498" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">fail ×3 → SQS DLQ</text>
  <text x="324" y="518" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">alarm → SNS email</text>

  <rect x="580" y="410" width="270" height="150" rx="12" fill="#0e1522" stroke="#2a3548"/>
  <text x="715" y="434" text-anchor="middle" fill="#3ee0b4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">3. Upload Pipeline</text>
  <text x="594" y="458" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">POST /uploads → presigned URL</text>
  <text x="594" y="478" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Browser PUT → S3 uploads inbox</text>
  <text x="594" y="498" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">EventBridge → Lambda → DynamoDB</text>
  <text x="594" y="518" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">file never goes through API Gateway</text>

  <rect x="870" y="410" width="250" height="150" rx="12" fill="#0e1522" stroke="#2a3548"/>
  <text x="995" y="434" text-anchor="middle" fill="#3ee0b4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">4. Pillar Quiz</text>
  <text x="884" y="458" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">GET /quiz public</text>
  <text x="884" y="478" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">POST /quiz → Cognito JWT</text>
  <text x="884" y="498" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">at API Gateway, then Lambda</text>
  <text x="884" y="518" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">→ DynamoDB score</text>

  <rect x="1140" y="250" width="220" height="310" rx="12" fill="#121b2c" stroke="#3ee0b4" stroke-width="1.5"/>
  <text x="1250" y="280" text-anchor="middle" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">DynamoDB</text>
  <text x="1250" y="300" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">aether-lab-app</text>
  <text x="1250" y="328" text-anchor="middle" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">one table</text>
  <text x="1250" y="352" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">counter</text>
  <text x="1250" y="370" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">jobs</text>
  <text x="1250" y="388" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">uploads</text>
  <text x="1250" y="406" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">quiz scores</text>
  <text x="1250" y="440" text-anchor="middle" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">S3 uploads inbox</text>
  <text x="1250" y="458" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">7-day expiry</text>
  <text x="1250" y="490" text-anchor="middle" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Cognito user pool</text>
  <text x="1250" y="508" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">quiz POST only</text>
  <text x="1250" y="536" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">X-Ray → CloudWatch</text>

  <line x1="40" y1="600" x2="1360" y2="600" stroke="#2a3548"/>
  <text x="40" y="630" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">How it ships — visitors never hit this</text>

  <rect x="40" y="650" width="250" height="80" rx="12" fill="#121b2c" stroke="#2a3548"/>
  <text x="165" y="684" text-anchor="middle" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">GitHub Actions</text>
  <text x="165" y="704" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">OIDC → no AKIA keys</text>

  <rect x="320" y="650" width="250" height="80" rx="12" fill="#121b2c" stroke="#2a3548"/>
  <text x="445" y="684" text-anchor="middle" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">IAM role</text>
  <text x="445" y="704" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">aether-lab-github-actions</text>

  <rect x="600" y="650" width="250" height="80" rx="12" fill="#121b2c" stroke="#2a3548"/>
  <text x="725" y="684" text-anchor="middle" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">S3 Terraform state</text>
  <text x="725" y="704" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">bootstrap bucket</text>

  <rect x="880" y="650" width="250" height="80" rx="12" fill="#121b2c" stroke="#2a3548"/>
  <text x="1005" y="684" text-anchor="middle" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">DynamoDB lock</text>
  <text x="1005" y="704" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">aether-lab-tf-lock</text>

  <text x="40" y="780" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Solid path: HTTPS request. Upload file: Browser PUT to uploads S3, then EventBridge. Website S3 ≠ uploads S3 ≠ Terraform state S3.</text>
  <text x="40" y="800" fill="#8b9bb4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">App data lives in one DynamoDB table. The lock table is only for terraform apply.</text>
</svg>
