<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for styling and depth -->
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Maximized SH Typography with Transparent Background and Drop Shadow for Contrast -->
  <text x="50%" y="53%" 
        font-family="Georgia, 'Times New Roman', Times, serif" 
        font-size="320" 
        font-weight="700" 
        font-style="italic"
        fill="url(#textGradient)" 
        filter="url(#shadow)"
        text-anchor="middle" 
        dominant-baseline="central" 
        letter-spacing="-6">SH</text>
</svg>
